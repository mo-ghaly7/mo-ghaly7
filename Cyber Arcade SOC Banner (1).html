<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Arcade SOC Banner</title>
<style>
:root{--bg:#05060f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color-scheme:dark}
body{display:flex;align-items:center;min-height:100vh}
canvas{width:100%;aspect-ratio:16/5;display:block;image-rendering:pixelated}
</style></head><body>
<canvas id="c"></canvas>
<script>
const W=320,H=100,c=document.getElementById('c');c.width=W;c.height=H;
const x=c.getContext('2d');x.imageSmoothingEnabled=false;
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
const g=bg.getContext('2d');g.imageSmoothingEnabled=false;
let s=11;const R=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const r=(k,col,a,b,w,h)=>{k.fillStyle=col;k.fillRect(a,b,w,h)};
const glow=(k,a,b,w,h,col,n=4)=>{k.globalAlpha=.07;k.fillStyle=col;for(let i=n;i>0;i--)k.fillRect(a-i,b-i,w+2*i,h+2*i);k.globalAlpha=1};
const NEON=['#19e6ff','#ff3df2','#b46bff','#2dff9a','#ffe14d'];

/* sky */
const sky=['#050714','#070a1c','#0a0c26','#0f0b30','#160b38','#1d0c40','#2a0e4d'];
for(let i=0;i<72;i++)r(g,sky[Math.min(6,i/12|0)],0,i,W,1);
g.globalAlpha=.8;for(let i=0;i<30;i++)r(g,'#cfe',R()*W|0,R()*30|0,1,1);g.globalAlpha=1;
/* far skyline */
for(let a=0;a<W;){const w=8+R()*14|0,h=22+R()*32|0;
 r(g,'#0d1038',a,72-h,w,h);
 g.globalAlpha=.7;
 for(let yy=72-h+2;yy<70;yy+=3)for(let xx=a+1;xx<a+w-1;xx+=3)if(R()<.3)r(g,NEON[R()*5|0],xx,yy,1,1);
 g.globalAlpha=1;a+=w+(R()*3|0);}
/* near skyline */
for(let a=-4;a<W;){const w=12+R()*16|0,h=16+R()*26|0;
 r(g,'#080a22',a,72-h,w,h);r(g,NEON[R()*5|0],a,72-h,w,1);
 if(R()<.6){const col=NEON[R()*5|0];glow(g,a+2,72-h+5,2,8,col,2);r(g,col,a+2,72-h+5,2,8)}
 a+=w+(R()*2|0);}
/* ceiling + window frame */
r(g,'#07061a',0,0,W,6);r(g,'#19e6ff',0,6,W,1);glow(g,0,6,W,1,'#19e6ff',3);
for(const mx of[104,216]){r(g,'#0a0a22',mx,7,3,76);r(g,'#ff3df2',mx+3,7,1,76)}
/* floor */
r(g,'#0b0722',0,82,W,18);r(g,'#ff3df2',0,82,W,1);glow(g,0,82,W,1,'#ff3df2',2);
g.globalAlpha=.6;
for(const yy of[85,89,95])r(g,'#3a1a80',0,yy,W,1);
for(let i=-14;i<=14;i++)for(let y=83;y<100;y++)r(g,'#3a1a80',160+i*(5+(y-82)*1.8)|0,y,1,1);
g.globalAlpha=1;
/* shelves */
function shelf(a,b,w){r(g,'#1a1440',a,b,w,2);r(g,'#ff3df2',a,b,w,1);
 for(let xx=a+2;xx<a+w-5;){const cw=3+R()*3|0,ch=3+R()*4|0,col=NEON[R()*5|0];r(g,col,xx,b-ch,cw,ch);r(g,'#0a0820',xx+1,b-ch+1,1,1);xx+=cw+1+(R()*2|0)}}
shelf(232,22,84);shelf(4,22,66);shelf(262,32,0);
/* cabinets */
const screens=[];
function cab(a,h,col){const t=84-h;
 glow(g,a-1,t-1,24,h+1,col,4);
 r(g,'#120e2b',a,t,22,h);r(g,col,a,t,22,1);r(g,col,a,t,1,h);r(g,col,a+21,t,1,h);
 r(g,col,a+2,t+2,18,4);r(g,'#fff',a+4,t+3,4,1);
 r(g,'#000',a+4,t+8,14,13);screens.push([a+4,t+8,14,13,col]);
 r(g,'#1d1740',a+1,t+23,20,5);
 r(g,'#ff3d6e',a+5,t+25,2,2);r(g,'#ffe14d',a+10,t+25,2,2);r(g,'#19e6ff',a+15,t+25,2,2);
 r(g,'#0a0820',a+2,t+30,18,h-30);r(g,col,a+2,t+h-2,18,1);}
cab(6,48,'#b46bff');cab(76,44,'#19e6ff');cab(262,50,'#ff3df2');cab(288,46,'#2dff9a');
/* platform */
glow(g,116,74,42,3,'#19e6ff',4);r(g,'#14102e',116,74,42,3);r(g,'#19e6ff',116,74,42,1);r(g,'#b46bff',116,77,42,1);

/* sprites */
const P={g:'#3ddc4a',G:'#1f9e3a',w:'#fff',k:'#111',r:'#e8283c',R:'#a01526',o:'#ff9a1f',n:'#5a2f12',b:'#b86a2a',t:'#f6d3a0',p:'#ff7ac8',y:'#ffd23d',h:'#f5b942',s:'#ffd9b8',c:'#2d9cff',u:'#f2c14e',Y:'#c28b2c',d:'#2a3070',z:'#1a1a2e',x:'#c0504d',H:'#2b2b4a'};
const GOOMBA=['....nnnn....','..nnbbbbnn..','.nbbbbbbbbn.','nbkkbbbbkkbn','nbbwkbbkwbbn','nbbbbbbbbbbn','.nbbbbbbbbn.','..tttttttt..','..tttttttt..','.kkkk..kkkk.'];
const SHY=['..rrrrrr..','.rrrrrrrr.','.rwwwwwwr.','.rwkwwkwr.','.rwkwwkwr.','.rwwwwwwr.','.rwwkkwwr.','.rrwwwwrr.','rrrrrrrrrr','rrrrrrrrrr','RrrrrrrrrR','.rrrrrrrr.','..oo..oo..','.ooo..ooo.'];
const YOSHI=['.......gggg.....','......gwwggg....','......gwkggggg..','......gwkgggggg.','.....gggggggggg.','....ggggggggg...','..gggggggggg....','.ggwwgrrrrg.....','.ggwwwgrrrrg....','.ggwwwwgrrrg....','..gwwwwwggg.....','..ggwwwwgg......','...gggggggg.....','...ggg..ggg.....','..oooo..oooo....','.ooooo..ooooo...'];
const PEACH=['..y..yy..y..','..yyyyyyyy..','..hhhhhhhh..','.hhsssssshh.','.hhsksskshh.','.hhsssssshh.','.hhhsssshhh.','.hh.pppp.hh.','..hpppcppph.','..pppppppp..','.pppppppppp.','.pppppppppp.','pppppppppppp','pppppppppppp','pppppppppppp','pppppppppppp','wpwpwpwpwpwp'];
const LUFFY=['.....uuuuuuu........','....uuuuuuuuu.......','....urrrrrrru.......','..uuuuuuuuuuuuuu....','...YYYYYYYYYYYY.....','.....HHHHHHHsss.....','....HHccsssssksss...','....HHccssssxssss...','......ssssssssws....','.......sssssss......','.....rrssssrrrr.....','....rrrsssrrrrrr....','....rrrsssrrrrrrss..','....rrrrrrrrrrssss..','....rrrrrrrrrcsssss.','....dddddddddd......','....ddddddddddddd...','....dcdddddddddddd..','..............sss...','..............sss...','.............zzzz...','.............cccc...'];
function spr(m,a,b,f){m.forEach((row,j)=>{for(let i=0;i<row.length;i++){const ch=row[f?row.length-1-i:i];if(ch!=='.'){x.fillStyle=P[ch];x.fillRect(a+i,b+j,1,1)}}})}
function shadow(a,w,col){x.globalAlpha=.18;x.fillStyle=col;x.fillRect(a-1,91,w+2,2);x.globalAlpha=1}

/* rain */
const drops=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,v:1+Math.random()*1.2}));
let t=0;const code=Array.from({length:14},(_,i)=>({x:108+i*7+(i*3%5),y:Math.random()*60,v:.4+Math.random()*.5}));
function frame(){
 t++;
 x.drawImage(bg,0,0);
 /* screens */
 for(const[a,b,w,h,col]of screens){
  r(x,'#000',a,b,w,h);
  for(let i=1;i<h-1;i+=3){const L=((Math.sin(t/14+i+a)+1)/2)*(w-3)+2|0;r(x,i%2?col:'#19e6ff',a+1,b+i,L,1)}
  if(t%90<3){x.globalAlpha=.4;r(x,'#fff',a,b+(t%h),w,1);x.globalAlpha=1}
  x.globalAlpha=.1;r(x,'#fff',a,b,w,2);x.globalAlpha=1;
  x.globalAlpha=.12;r(x,col,a-2,86,w+4,9);x.globalAlpha=1;
 }
 /* holograms */
 for(const[a,b,w,h]of[[48,28,26,18],[232,44,24,16],[150,60,0,0]]){
  if(!w)continue;
  const j=Math.sin(t/25+a)*1.5|0;
  x.globalAlpha=.18;r(x,'#19e6ff',a,b+j,w,h);x.globalAlpha=.9;
  r(x,'#19e6ff',a,b+j,w,1);r(x,'#19e6ff',a,b+j+h-1,w,1);r(x,'#19e6ff',a,b+j,1,h);r(x,'#19e6ff',a+w-1,b+j,1,h);
  x.globalAlpha=.7;
  if(a==48){for(let i=0;i<7;i++)for(let k=0;k<5;k++)if((i*7+k*3)%4!=0){x.globalAlpha=.35;r(x,'#19e6ff',a+3+i*3,b+j+3+k*3,1,1)}
  x.globalAlpha=.9;r(x,'#2dff9a',a+3+((t/6)%12|0)*2,b+j+2,1,h-4);
  for(const[px,py]of[[6,5],[15,9],[10,13],[19,6]])r(x,((t/12|0)+px)%3==0?'#ff2d4d':'#2dff9a',a+px,b+j+py,2,2);
 }else for(let i=3;i<h-3;i+=3){const bad=((t/20|0)+i)%5==0;r(x,bad?'#ff2d4d':'#2dff9a',a+2,b+j+i,bad?w-5:((Math.sin(t/10+i)+1)/2)*(w-8)+3|0,1)}
  x.globalAlpha=.1;r(x,'#19e6ff',a+3,b+j+h,w-6,3);x.globalAlpha=1;
 }
 /* SOC / cyber layer */
 const q=(col,a,b,w=1,h=1)=>r(x,col,a,b,w,h),on=(t/15|0)%2;
 const s1=screens[1],s3=screens[3];
 q('#ffe14d',s1[0]+4,s1[1]+6,6,5);q('#ffe14d',s1[0]+5,s1[1]+3,1,3);q('#ffe14d',s1[0]+8,s1[1]+3,1,3);q('#ffe14d',s1[0]+5,s1[1]+2,4,1);q('#000',s1[0]+7,s1[1]+8,1,2);
 q('#2dff9a',s3[0]+2,s3[1]+3);q('#2dff9a',s3[0]+3,s3[1]+4);q('#2dff9a',s3[0]+2,s3[1]+5);
 if((t/20|0)%2)q('#2dff9a',s3[0]+6,s3[1]+5,3,1);
 /* shield hologram */
 const sx=164,sy=60+(Math.sin(t/20)*1.5|0);
 x.globalAlpha=.25;q('#19e6ff',sx-2,sy-2,14,16);x.globalAlpha=.95;
 q('#19e6ff',sx,sy,10,1);for(let i=1;i<7;i++){q('#19e6ff',sx,sy+i);q('#19e6ff',sx+9,sy+i)}
 for(let i=0;i<4;i++){q('#19e6ff',sx+i,sy+7+i);q('#19e6ff',sx+9-i,sy+7+i)}q('#19e6ff',sx+4,sy+11,2,1);
 [[3,5],[4,6],[5,5],[6,4],[7,3]].forEach(p=>q('#2dff9a',sx+p[0],sy+p[1]));x.globalAlpha=1;
 /* firewall + incoming packets from the masked intruder */
 x.globalAlpha=.22+.1*Math.sin(t/6);q('#ff8a1f',224,60,2,32);x.globalAlpha=.6;
 for(let i=0;i<6;i++)if(((t/5|0)+i)%3==0)q('#ffe14d',224+(i%2),62+i*5);
 for(let k=0;k<4;k++){const px=234-((t*.5+k*3)%10|0);x.globalAlpha=.9;q('#ff2d4d',px,80+k*3,2,1)}x.globalAlpha=1;
 /* Yoshi scan beam to the malware Goomba */
 x.globalAlpha=.85;for(let i=0;i<24;i++)if((i+(t>>1))%3==0)q('#2dff9a',143+(65*i/24|0),63+(17*i/24|0));x.globalAlpha=1;
 /* alert beacon, ambient red pulse, warning triangle */
 x.globalAlpha=on?.9:.25;q('#ff2d4d',300,7,6,2);x.globalAlpha=on?.12:0;q('#ff2d4d',296,4,14,10);
 x.globalAlpha=on?.05:0;q('#ff2d4d',0,0,W,H);x.globalAlpha=1;
 if(on){q('#ff2d4d',210,67);q('#ff2d4d',209,68,3,1);q('#ff2d4d',208,69,5,1);q('#ff2d4d',207,70,7,1);q('#fff',210,68,1,2)}
 /* gaming chair + desk + SOC workstation */
 q('#ff2d4d',157,78,1,13);q('#1b1b38',158,78,4,13);q('#1b1b38',158,75,5,3);q('#ff2d4d',158,75,5,1);
 q('#1b1b38',160,91,15,2);x.globalAlpha=.5;q('#19e6ff',160,93,15,1);x.globalAlpha=1;
 q('#2a2a50',166,93,2,2);q('#555',160,95,3,1);q('#555',166,95,3,1);q('#555',172,95,3,1);
 q('#14102e',176,88,32,2);q('#19e6ff',176,88,32,1);q('#0a0820',178,90,30,5);q('#b46bff',178,90,30,1);
 q('#2a2a50',174,87,14,1);for(let i=0;i<7;i++)q(i%2?'#ff3df2':'#19e6ff',175+i*2,87);q('#2a2a50',191,87,2,1);
 const mx=176,my=62;
 glow(x,mx,my,30,24,'#19e6ff',4);
 q('#0c0a1f',mx,my,30,24);q('#19e6ff',mx,my,30,1);q('#19e6ff',mx,my+23,30,1);q('#19e6ff',mx,my,1,24);q('#19e6ff',mx+29,my,1,24);
 q('#050818',mx+2,my+2,26,18);q(on?'#ff2d4d':'#2dff9a',mx+14,my+21,2,1);
 q('#1d1740',189,85,3,3);q('#1d1740',185,87,11,1);
 const dx=178,dy=64;
 q('#111a45',dx,dy,26,3);q('#ff2d4d',dx+1,dy+1,2,1);q('#ffe14d',dx+4,dy+1,2,1);q('#2dff9a',dx+7,dy+1,2,1);q('#19e6ff',dx+16,dy+1,((Math.sin(t/12)+1)/2)*7+2|0,1);
 q('#0b1030',dx,dy+3,13,7);
 for(let i=0;i<12;i++){const v=(Math.sin(t/9+i*.8)+Math.sin(t/5+i*1.7)*.5+1.5)*1.6|0;q('#19e6ff',dx+1+i,dy+9-Math.min(v,5))}
 q('#0b1030',dx+13,dy+3,13,7);
 for(let i=0;i<6;i++){const hh=2+((Math.sin(t/8+i*1.3)+1)*2)|0,spike=((t/20|0)+i)%9==0;q(spike?'#ff2d4d':i%3==2?'#ffe14d':'#2dff9a',dx+14+i*2,dy+9-hh,1,hh)}
 q('#0b1030',dx,dy+10,13,8);
 for(let i=0;i<4;i++){const k=((t/40|0)+i)%5,col=['#ff2d4d','#ffe14d','#2dff9a','#2dff9a','#ffe14d'][k];q(col,dx+1,dy+11+i*2,1,1);q('#5a6a9a',dx+3,dy+11+i*2,4+((k*3+i)%6),1)}
 q('#0b1030',dx+13,dy+10,13,8);
 q('#ff2d4d',dx+14,dy+11,3,2);q('#5a6a9a',dx+18,dy+11,6,1);q('#5a6a9a',dx+18,dy+13,4,1);q('#3a4a7a',dx+14,dy+15,10,1);q('#3a4a7a',dx+14,dy+17,7,1);
 if((t/10|0)%2)q('#ff2d4d',dx+23,dy+15,2,2);
 x.globalAlpha=.08;q('#fff',dx,dy+((t/3)%18|0),26,1);x.globalAlpha=1;
 /* characters */
 const bob=(t/24|0)%2;
 shadow(40,12,'#ff7ac8');shadow(208,12,'#ff9a1f');shadow(236,10,'#e8283c');
 spr(PEACH,40,73+((t/40|0)%2),false);
 spr(YOSHI,128,58-bob,false);
 spr(GOOMBA,208+((t/50|0)%3-1),80-((t/10|0)%2),false);
 spr(SHY,236,76+bob,true);
 spr(LUFFY,158,73+((t/45|0)%2),false);
 /* neon sign flicker strip over floor */
 x.globalAlpha=.08+.04*Math.sin(t/8);r(x,'#ff3df2',0,83,W,2);x.globalAlpha=1;
 /* rain */
 x.fillStyle='rgba(170,230,255,.35)';
 for(const d of drops){x.fillRect(d.x|0,d.y|0,1,3);d.x-=.5;d.y+=d.v*1.6;if(d.y>H){d.y=-3;d.x=Math.random()*(W+20)}if(d.x<0)d.x=W}
 /* green code rain behind the glass */
 for(const d of code){for(let k=0;k<6;k++){const yy=(d.y-k*2)|0;if(yy>7&&yy<82){x.globalAlpha=.3-k*.045;q('#2dff9a',d.x|0,yy)}}x.globalAlpha=1;d.y+=d.v;if(d.y>92)d.y=0}
 /* glitch */
 if(t%160<5){const b=Math.random()*80|0,h=2+Math.random()*6|0,dx=(Math.random()*10-5)|0;x.drawImage(c,0,b,W,h,dx,b,W,h);x.globalAlpha=.25;r(x,'#ff3df2',0,b,W,1);x.globalAlpha=1}
 /* scanlines + vignette */
 x.globalAlpha=.12;for(let y=0;y<H;y+=2)r(x,'#000',0,y,W,1);x.globalAlpha=1;
 const v=x.createRadialGradient(W/2,H/2,H*.5,W/2,H/2,W*.62);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');
 x.fillStyle=v;x.fillRect(0,0,W,H);
 requestAnimationFrame(frame);
}
frame();
</script></body></html>
